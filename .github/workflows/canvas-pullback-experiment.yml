name: Canvas pull-back experimental preparation
on:
  workflow_dispatch:
  push:
    branches: [experimental/canvas-pullback-1000]
    paths:
      - 'experimental/canvas-pullback-1000/**'
      - '.github/workflows/canvas-pullback-experiment.yml'
permissions:
  contents: read
jobs:
  offline-patch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test encoding and refuse unsupported inputs without vendor binaries
        run: python3 -m unittest discover -s experimental/canvas-pullback-1000 -p 'test_*.py' -v
