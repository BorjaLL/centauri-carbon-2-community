name: Synchronize reviewed Panda Breath integration
on:
  push:
    branches: [integrate/pandabreath-validation]
    paths: [.github/workflows/sync-reviewed-pandabreath.yml]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Complete all nine locale dictionaries
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          additions=json.loads("{\"en\":{\"common.pandabreath\":\"Panda Breath\",\"pandabreath.description\":\"Chamber heater controls, served by the heater on your network.\",\"pandabreath.disabled\":\"The {name} page is turned off.\",\"pandabreath.open_integrations\":\"Turn it on in Settings → Integrations\",\"pandabreath.open_in_new_tab\":\"Open in new tab\",\"pandabreath.frame_note\":\"Loaded directly from {host}: this browser must be on the same network as the {name}. If the page stays blank, check the address in Settings → Integrations.\",\"settings.pandabreath_page\":\"{name} page\",\"settings.pandabreath_page_description\":\"Adds a menu page with the controls of a {name} chamber heater. Saved in this browser.\",\"settings.pandabreath_address\":\"{name} address\",\"settings.save_address\":\"Save address\",\"settings.pandabreath_address_saved\":\"{name} address saved\",\"settings.pandabreath_address_invalid\":\"Enter a host name or IP address, without http:// (for example {host}).\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_dragonbreath\":\"DragonBreath firmware\",\"settings.pandabreath_dragonbreath_description\":\"Turn on if the Panda Breath runs the open DragonBreath firmware. Changes the name to DragonBreath and the default address to dragonbreath.local.\"},\"it\":{\"common.pandabreath\":\"Panda Breath\",\"pandabreath.description\":\"Controlli del riscaldatore della camera, forniti dal riscaldatore sulla tua rete.\",\"pandabreath.disabled\":\"La pagina {name} è disattivata.\",\"pandabreath.open_integrations\":\"Attivala in Impostazioni → Integrazioni\",\"pandabreath.open_in_new_tab\":\"Apri in una nuova scheda\",\"pandabreath.frame_note\":\"Caricata direttamente da {host}: questo browser deve essere sulla stessa rete del {name}. Se la pagina resta vuota, controlla l'indirizzo in Impostazioni → Integrazioni.\",\"settings.pandabreath_page\":\"Pagina {name}\",\"settings.pandabreath_page_description\":\"Aggiunge al menu una pagina con i controlli di un riscaldatore della camera {name}. Salvata in questo browser.\",\"settings.pandabreath_address\":\"Indirizzo {name}\",\"settings.save_address\":\"Salva indirizzo\",\"settings.pandabreath_address_saved\":\"Indirizzo {name} salvato\",\"settings.pandabreath_address_invalid\":\"Inserisci un nome host o un indirizzo IP, senza http:// (ad esempio {host}).\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_dragonbreath\":\"Firmware DragonBreath\",\"settings.pandabreath_dragonbreath_description\":\"Attiva se il Panda Breath usa il firmware aperto DragonBreath. Cambia il nome in DragonBreath e l'indirizzo predefinito in dragonbreath.local.\"},\"fr\":{\"common.pandabreath\":\"Panda Breath\",\"pandabreath.description\":\"Commandes du chauffage de l'enceinte, servies par le chauffage sur votre réseau.\",\"pandabreath.disabled\":\"La page {name} est désactivée.\",\"pandabreath.open_integrations\":\"Activez-la dans Paramètres → Intégrations\",\"pandabreath.open_in_new_tab\":\"Ouvrir dans un nouvel onglet\",\"pandabreath.frame_note\":\"Chargée directement depuis {host} : ce navigateur doit être sur le même réseau que le {name}. Si la page reste vide, vérifiez l'adresse dans Paramètres → Intégrations.\",\"settings.pandabreath_page\":\"Page {name}\",\"settings.pandabreath_page_description\":\"Ajoute au menu une page avec les commandes d'un chauffage d'enceinte {name}. Enregistré dans ce navigateur.\",\"settings.pandabreath_address\":\"Adresse du {name}\",\"settings.save_address\":\"Enregistrer l'adresse\",\"settings.pandabreath_address_saved\":\"Adresse du {name} enregistrée\",\"settings.pandabreath_address_invalid\":\"Saisissez un nom d'hôte ou une adresse IP, sans http:// (par exemple {host}).\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_dragonbreath\":\"Firmware DragonBreath\",\"settings.pandabreath_dragonbreath_description\":\"Activez si le Panda Breath utilise le firmware libre DragonBreath. Le nom devient DragonBreath et l'adresse par défaut dragonbreath.local.\"},\"pl\":{\"common.pandabreath\":\"Panda Breath\",\"pandabreath.description\":\"Sterowanie grzałką komory, udostępniane przez grzałkę w Twojej sieci.\",\"pandabreath.disabled\":\"Strona {name} jest wyłączona.\",\"pandabreath.open_integrations\":\"Włącz ją w Ustawienia → Integracje\",\"pandabreath.open_in_new_tab\":\"Otwórz w nowej karcie\",\"pandabreath.frame_note\":\"Wczytywana bezpośrednio z {host}: ta przeglądarka musi być w tej samej sieci co {name}. Jeśli strona pozostaje pusta, sprawdź adres w Ustawienia → Integracje.\",\"settings.pandabreath_page\":\"Strona {name}\",\"settings.pandabreath_page_description\":\"Dodaje do menu stronę ze sterowaniem grzałki komory {name}. Zapisywane w tej przeglądarce.\",\"settings.pandabreath_address\":\"Adres {name}\",\"settings.save_address\":\"Zapisz adres\",\"settings.pandabreath_address_saved\":\"Zapisano adres {name}\",\"settings.pandabreath_address_invalid\":\"Wpisz nazwę hosta lub adres IP, bez http:// (na przykład {host}).\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_dragonbreath\":\"Oprogramowanie DragonBreath\",\"settings.pandabreath_dragonbreath_description\":\"Włącz, jeśli Panda Breath działa na otwartym oprogramowaniu DragonBreath. Zmienia nazwę na DragonBreath, a domyślny adres na dragonbreath.local.\"},\"cs\":{\"common.pandabreath\":\"Panda Breath\",\"pandabreath.description\":\"Ovládání topení komory, poskytované topením ve vaší síti.\",\"pandabreath.disabled\":\"Stránka {name} je vypnutá.\",\"pandabreath.open_integrations\":\"Zapněte ji v Nastavení → Integrace\",\"pandabreath.open_in_new_tab\":\"Otevřít na nové kartě\",\"pandabreath.frame_note\":\"Načítá se přímo z {host}: tento prohlížeč musí být ve stejné síti jako {name}. Pokud stránka zůstane prázdná, zkontrolujte adresu v Nastavení → Integrace.\",\"settings.pandabreath_page\":\"Stránka {name}\",\"settings.pandabreath_page_description\":\"Přidá do nabídky stránku s ovládáním topení komory {name}. Uloženo v tomto prohlížeči.\",\"settings.pandabreath_address\":\"Adresa {name}\",\"settings.save_address\":\"Uložit adresu\",\"settings.pandabreath_address_saved\":\"Adresa {name} uložena\",\"settings.pandabreath_address_invalid\":\"Zadejte název hostitele nebo IP adresu, bez http:// (například {host}).\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_dragonbreath\":\"Firmware DragonBreath\",\"settings.pandabreath_dragonbreath_description\":\"Zapněte, pokud Panda Breath používá otevřený firmware DragonBreath. Změní název na DragonBreath a výchozí adresu na dragonbreath.local.\"},\"hu\":{\"common.pandabreath\":\"Panda Breath\",\"pandabreath.description\":\"A kamrafűtés vezérlője, amelyet a hálózatodon lévő fűtés szolgáltat.\",\"pandabreath.disabled\":\"A {name} oldal ki van kapcsolva.\",\"pandabreath.open_integrations\":\"Kapcsold be: Beállítások → Integrációk\",\"pandabreath.open_in_new_tab\":\"Megnyitás új lapon\",\"pandabreath.frame_note\":\"Közvetlenül innen töltődik be: {host}. Ennek a böngészőnek ugyanazon a hálózaton kell lennie, mint a {name}. Ha az oldal üres marad, ellenőrizd a címet: Beállítások → Integrációk.\",\"settings.pandabreath_page\":\"{name} oldal\",\"settings.pandabreath_page_description\":\"Egy menüoldalt ad hozzá a {name} kamrafűtés vezérlőivel. Ebben a böngészőben tárolódik.\",\"settings.pandabreath_address\":\"{name} címe\",\"settings.save_address\":\"Cím mentése\",\"settings.pandabreath_address_saved\":\"{name} cím mentve\",\"settings.pandabreath_address_invalid\":\"Adj meg egy gépnevet vagy IP-címet, http:// nélkül (például {host}).\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_dragonbreath\":\"DragonBreath firmware\",\"settings.pandabreath_dragonbreath_description\":\"Kapcsold be, ha a Panda Breath a nyílt DragonBreath firmware-t futtatja. A név DragonBreath lesz, az alapértelmezett cím pedig dragonbreath.local.\"},\"es\":{\"common.pandabreath\":\"Panda Breath\",\"settings.pandabreath_address\":\"Dirección de {name}\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_page_description\":\"Añade al menú una página con los controles del calentador de cámara {name}. Se guarda en este navegador.\",\"settings.save_address\":\"Guardar dirección\",\"pandabreath.frame_note\":\"Se carga directamente desde {host}: este navegador debe estar en la misma red que {name}. Si la página queda en blanco, comprueba la dirección en Ajustes → Integraciones.\",\"settings.pandabreath_page\":\"Página de {name}\",\"pandabreath.open_in_new_tab\":\"Abrir en una pestaña nueva\",\"pandabreath.description\":\"Controles del calentador de la cámara, servidos por el calentador en tu red.\",\"settings.pandabreath_address_invalid\":\"Introduce un nombre de host o una dirección IP, sin http:// (por ejemplo, {host}).\",\"settings.pandabreath_address_saved\":\"Dirección de {name} guardada\",\"pandabreath.disabled\":\"La página de {name} está desactivada.\",\"settings.pandabreath_dragonbreath\":\"Firmware DragonBreath\",\"pandabreath.open_integrations\":\"Actívala en Ajustes → Integraciones\",\"settings.pandabreath_dragonbreath_description\":\"Activa esta opción si Panda Breath utiliza el firmware abierto DragonBreath. Cambia el nombre a DragonBreath y la dirección predeterminada a dragonbreath.local.\"},\"ru\":{\"common.pandabreath\":\"Panda Breath\",\"settings.pandabreath_address\":\"Адрес {name}\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_page_description\":\"Добавляет в меню страницу управления нагревателем камеры {name}. Сохраняется в этом браузере.\",\"settings.save_address\":\"Сохранить адрес\",\"pandabreath.frame_note\":\"Загружается напрямую с {host}: браузер должен быть в одной сети с {name}. Если страница пустая, проверьте адрес в Настройки → Интеграции.\",\"settings.pandabreath_page\":\"Страница {name}\",\"pandabreath.open_in_new_tab\":\"Открыть в новой вкладке\",\"pandabreath.description\":\"Управление нагревателем камеры через его веб-страницу в вашей сети.\",\"settings.pandabreath_address_invalid\":\"Введите имя хоста или IP-адрес без http:// (например, {host}).\",\"settings.pandabreath_address_saved\":\"Адрес {name} сохранён\",\"pandabreath.disabled\":\"Страница {name} отключена.\",\"settings.pandabreath_dragonbreath\":\"Прошивка DragonBreath\",\"pandabreath.open_integrations\":\"Включите её в Настройки → Интеграции\",\"settings.pandabreath_dragonbreath_description\":\"Включите, если Panda Breath использует открытую прошивку DragonBreath. Название изменится на DragonBreath, а адрес по умолчанию — на dragonbreath.local.\"},\"zh\":{\"common.pandabreath\":\"Panda Breath\",\"settings.pandabreath_address\":\"{name} 地址\",\"common.dragonbreath\":\"DragonBreath\",\"settings.pandabreath_page_description\":\"在菜单中添加 {name} 腔体加热器控制页面。设置保存在此浏览器中。\",\"settings.save_address\":\"保存地址\",\"pandabreath.frame_note\":\"直接从 {host} 加载：此浏览器必须与 {name} 位于同一网络。如果页面空白，请在设置 → 集成中检查地址。\",\"settings.pandabreath_page\":\"{name} 页面\",\"pandabreath.open_in_new_tab\":\"在新标签页中打开\",\"pandabreath.description\":\"通过局域网中加热器提供的网页控制腔体加热器。\",\"settings.pandabreath_address_invalid\":\"请输入主机名或 IP 地址，不含 http://（例如 {host}）。\",\"settings.pandabreath_address_saved\":\"已保存 {name} 地址\",\"pandabreath.disabled\":\"{name} 页面已关闭。\",\"settings.pandabreath_dragonbreath\":\"DragonBreath 固件\",\"pandabreath.open_integrations\":\"在设置 → 集成中启用\",\"settings.pandabreath_dragonbreath_description\":\"如果 Panda Breath 使用开源 DragonBreath 固件，请启用此选项。名称将更改为 DragonBreath，默认地址将更改为 dragonbreath.local。\"}}")
          for lang,values in additions.items():
              p=Path('cc2-control/web-src/public/locales')/(lang+'.json')
              data=json.loads(p.read_text(encoding='utf-8'))
              data.update(values)
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Check and rebuild reviewed UI
        working-directory: cc2-control/web-src
        run: npm ci && npm run check && npm run build
      - name: Commit synchronized sources and generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a cc2-control/web/. cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/
          git add cc2-control/web-src/public/locales cc2-control/web cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web
          git commit -m "Complete heater translations and rebuild synchronized UI"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m "Pin builder snapshot to reviewed Panda Breath integration"
      - name: Validate snapshot and unchanged version
        run: |
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_locales_static.py
          python3 cc2-control/tests/test_locale_coverage_static.py
          python3 cc2-control/tests/test_web_sync_static.py
          test "$(cat cc2-control/VERSION)" = "1.2.17"
      - run: git push origin HEAD:refs/heads/integrate/pandabreath-validation
