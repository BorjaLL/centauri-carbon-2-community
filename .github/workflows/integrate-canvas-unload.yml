name: Prepare reviewed Canvas unload integration
on:
  push:
    branches: [integrate/canvas-unload-validation]
    paths: [.github/workflows/integrate-canvas-unload.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Host regression tests with warnings as errors
        working-directory: cc2-control
        run: make clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
      - name: Check generated UI and actual Canvas controls
        working-directory: cc2-control/web-src
        run: |
          npm ci
          npm run check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:canvas-reset
          npm run test:canvas-states
      - name: Synchronize the public source snapshot and exact builder references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a cc2-control/web/. cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/
          git add cc2-control/web cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web
          if ! git diff --cached --quiet; then git commit -m "Synchronize generated UI for Canvas pull-back integration"; fi
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m "Pin builder sources to validated Canvas pull-back integration"
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_web_sync_static.py
          test "$(cat cc2-control/VERSION)" = "1.2.17"
          git push origin HEAD:refs/heads/integrate/canvas-unload-validation

