name: Synchronize accepted object map after file library merge
on:
  push:
    branches: [feature/object-map-single-view]
    paths: [.github/workflows/sync-object-map-final.yml]
permissions:
  contents: write
jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Regenerate and verify the accepted cumulative sources
        run: |
          python3 experimental/pr128-integration/sync_source.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 builder/current/launch_helpers/tests/test_launcher.py
          python3 cc2-control/tests/test_web_sync_static.py
          python3 cc2-control/tests/test_locales_static.py
      - name: Publish canonical source references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builder/current
          git commit -m 'Repin accepted PR197 and PR199 sources after upstream merge'
          git push origin HEAD:feature/object-map-single-view
