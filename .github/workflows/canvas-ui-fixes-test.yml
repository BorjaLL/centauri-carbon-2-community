name: Canvas UI fixes qualification
on:
  push:
    branches: [test/canvas-ui-fixes-validation]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply reviewable candidate patch
        run: |
          git apply --check experimental/canvas-ui-fixes/changes.patch
          git apply experimental/canvas-ui-fixes/changes.patch
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Rebuild UI and check sources
        working-directory: cc2-control/web-src
        run: npm ci && npm run check && npm run build
      - name: Native host tests with warnings as errors
        run: make clean test CROSS= CC=gcc EXTRA_CFLAGS=-Werror
        working-directory: cc2-control
      - name: Install ARM tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - name: ARM build and smoke test
        run: |
          make clean all EXTRA_CFLAGS=-Werror
          CC2_TEST_RUNNER=qemu-arm python3 tests/test_smoke.py dist/cc2-control/cc2-control
        working-directory: cc2-control
