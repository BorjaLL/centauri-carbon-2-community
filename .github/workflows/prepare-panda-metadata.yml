name: Prepare Panda metadata integration
on:
  push:
    branches: [fix/panda-metadata-integration]
    paths: [.github/workflows/prepare-panda-metadata.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and test actual HTTP and WebSocket metadata endpoints
        working-directory: cc2-control
        run: |
          make build/cc2-control CROSS= CC=gcc EXTRA_CFLAGS=-Werror
          python3 tests/test_panda_bridge.py build/cc2-control
          gcc -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror -D_POSIX_C_SOURCE=200809L -pthread tests/test_panda_metadata.c -o /tmp/panda-metadata-test -lm
          /tmp/panda-metadata-test
      - name: Verify guards under address and undefined sanitizers
        working-directory: cc2-control
        run: |
          gcc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror -D_POSIX_C_SOURCE=200809L -pthread -fsanitize=address,undefined -fno-sanitize-recover=all tests/test_panda_metadata.c -o /tmp/panda-metadata-asan -lm
          /tmp/panda-metadata-asan
      - name: Synchronize canonical source snapshot and builder pins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git commit -m "Synchronize builder sources for Noahwhite2014's Panda metadata bridge"
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          git push origin HEAD:refs/heads/fix/panda-metadata-integration
