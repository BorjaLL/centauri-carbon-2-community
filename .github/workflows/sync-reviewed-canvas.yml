name: Synchronize reviewed Canvas recovery
on:
  push:
    branches: [fix/canvas-reboot-recovery-guidance]
    paths: [.github/workflows/sync-reviewed-canvas.yml]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Check and rebuild reviewed UI
        working-directory: cc2-control/web-src
        run: npm ci && npm run check && npm run build
      - name: Commit synchronized generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -a cc2-control/web/. cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web/
          git add cc2-control/web cc2-control/firmware-integration/overlay/opt/usr/cc2-control/web
          git commit -m "Rebuild Canvas recovery guidance on current translations"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m "Synchronize builder snapshot with reviewed Canvas guidance"
      - name: Validate snapshot and unchanged version
        run: |
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_locales_static.py
          python3 cc2-control/tests/test_locale_coverage_static.py
          python3 cc2-control/tests/test_web_sync_static.py
          test "$(cat cc2-control/VERSION)" = "1.2.17"
      - run: git push origin HEAD:refs/heads/fix/canvas-reboot-recovery-guidance
