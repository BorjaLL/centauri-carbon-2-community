name: Synchronize validated Canvas production sources
on:
  push:
    branches: [sync/canvas-recovery-production]
permissions:
  contents: write
jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: sync/canvas-recovery-production
      - name: Synchronize canonical snapshot and verify
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 experimental/pr128-integration/sync_source.py
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_web_sync_static.py
          python3 cc2-control/tests/test_locales_static.py
          git rm .github/workflows/sync-validated-canvas.yml
          git add builder/current
          git commit -m "Pin validated Canvas recovery sources and remove preparation workflow"
          git push origin HEAD:refs/heads/sync/canvas-recovery-production
