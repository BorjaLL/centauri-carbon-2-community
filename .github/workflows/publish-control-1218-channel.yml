name: Synchronize published 1.2.18 stable catalog
on:
  push:
    branches: [publish/cc2-control-1.2.18-channel]
    paths: [.github/workflows/publish-control-1218-channel.yml]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify published catalog and synchronize builder sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          curl -fL 'https://github.com/Neme77/centauri-carbon-2-community/releases/download/CC2-Control-1.2.18-V4.4/update-channel.cc2catalog' -o /tmp/published-1218.cc2catalog
          cmp /tmp/published-1218.cc2catalog cc2-control/update-channel.cc2catalog
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current/components/cc2-control/source/source.zip builder/current/prepare.py builder/current/core/firmware_builder.py builder/current/launch_helpers/run_build.py
          git commit -m "Synchronize builder sources with the published 1.2.18 catalog"
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          git push origin HEAD:refs/heads/publish/cc2-control-1.2.18-channel
