name: Prepare update file picker review
on:
  push:
    branches: [fix/update-file-picker]
    paths: [.github/workflows/prepare-file-picker.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: cc2-control/web-src/package-lock.json
      - run: npm ci
        working-directory: cc2-control/web-src
      - run: npm run check && npm run build
        working-directory: cc2-control/web-src
      - run: npx playwright install --with-deps chromium
        working-directory: cc2-control/web-src
      - run: npm run test:updates
        working-directory: cc2-control/web-src
        env:
          CC2_SCREENSHOTS: ${{ runner.temp }}/update-file-picker
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: update-file-picker-preview
          path: ${{ runner.temp }}/update-file-picker
      - name: Commit rebuilt UI and synchronize public builder snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cc2-control/web
          git diff --cached --quiet || git commit -m "Rebuild update file chooser styling"
          python3 experimental/pr128-integration/sync_source.py
          git add builder/current
          git commit -m "Synchronize builder sources for update chooser fix"
          python3 -m unittest discover -s builder/current/tests -p 'test_*.py'
          python3 cc2-control/tests/test_web_sync_static.py
          git push origin HEAD:refs/heads/fix/update-file-picker
